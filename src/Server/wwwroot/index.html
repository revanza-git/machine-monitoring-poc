<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Monitoring</title>
<!--
  The portal is deliberately one static page: it calls /api/machines for the
  fleet table and /api/machines/{id}/metrics for the chart, nothing else.
  Chart.js is the only dependency. No build step, no framework.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --series-1: #2a78d6; --series-2: #eb6834;
    --good: #0ca30c; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --series-1: #3987e5; --series-2: #d95926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .sub { color: var(--ink-2); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--series-1) 8%, transparent); }
  tbody tr.selected { background: color-mix(in srgb, var(--series-1) 14%, transparent); }
  .num { text-align: right; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.online::before { background: var(--good); }
  .status.unresponsive::before { background: var(--critical); }
  .bar { display: inline-block; width: 60px; height: 6px; background: var(--grid); border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--series-1); }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  .chart-wrap { position: relative; height: 320px; }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<h1>Machine Monitoring <span class="muted">· PoC</span></h1>

<section class="card">
  <div class="row">
    <h2>Fleet</h2>
    <span class="sub" id="fleet-sub">loading…</span>
  </div>
  <div style="overflow-x:auto">
  <table id="fleet">
    <thead><tr>
      <th>Machine</th><th>Status</th><th>Last seen</th>
      <th class="num">CPU</th><th>Memory</th><th class="hide-sm">Drives</th>
      <th class="hide-sm">Active user</th><th class="hide-sm">Agent</th><th class="num hide-sm">Outbox</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  </div>
</section>

<section class="card">
  <div class="row">
    <h2 id="chart-title">Usage</h2>
    <span class="sub" id="chart-sub"></span>
    <span style="flex:1"></span>
    <span class="sub">Range</span>
    <span id="ranges" role="group" aria-label="Time range">
      <button data-hours="1">1 h</button>
      <button data-hours="6">6 h</button>
      <button data-hours="24">24 h</button>
      <button data-hours="168">7 d</button>
    </span>
  </div>
  <div class="chart-wrap"><canvas id="chart" role="img" aria-label="CPU and memory usage over time"></canvas></div>
</section>

<section class="card" id="projects-card" hidden>
  <div class="row">
    <h2>Projects</h2>
    <span class="sub" id="projects-sub"></span>
  </div>
  <div style="overflow-x:auto">
  <table id="projects">
    <thead><tr><th>Project</th><th class="num">Total (sum of copies)</th><th>Copies</th></tr></thead>
    <tbody></tbody>
  </table>
  </div>
</section>

<script>
  const REFRESH_MS = 10_000;
  let selectedId = null, rangeHours = 1, chart = null;

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const gb = (mb) => (mb / 1024).toFixed(1);
  const pct = (used, total) => total ? Math.round(used / total * 100) : 0;
  const ago = (iso) => {
    if (!iso) return '—';
    const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
    return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`;
  };
  const bar = (p) => `<span class="bar" title="${p}%"><i style="width:${p}%"></i></span>${p}%`;
  // Every string that an agent chose (hostname, user, drive and folder names)
  // goes through here before it lands in innerHTML: a folder called
  // <img src=x onerror=...> must render as text, not run.
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function loadFleet() {
    const res = await fetch('/api/machines');
    const rows = await res.json();
    const tbody = document.querySelector('#fleet tbody');
    tbody.innerHTML = rows.map(m => `
      <tr data-id="${m.machine_id}" class="${m.machine_id === selectedId ? 'selected' : ''}">
        <td><strong>${esc(m.name)}</strong> <span class="muted">${m.hostname && m.hostname !== m.name ? esc(m.hostname) : ''}</span></td>
        <td><span class="status ${m.status}">${m.status}</span></td>
        <td>${ago(m.last_seen)}</td>
        <td class="num">${m.cpu_pct == null ? '—' : m.cpu_pct.toFixed(1) + '%'}</td>
        <td>${m.mem_total_mb ? bar(pct(m.mem_used_mb, m.mem_total_mb)) + ` <span class="muted">${gb(m.mem_used_mb)} / ${gb(m.mem_total_mb)} GB</span>` : '—'}</td>
        <td class="hide-sm">${(m.drives || []).map(d => `${esc(d.name)} ${bar(pct(d.total_bytes - d.free_bytes, d.total_bytes))}`).join(' &nbsp; ')}</td>
        <td class="hide-sm">${m.active_user ? esc(m.active_user) : (m.last_user ? `<span class="muted" title="Nobody signed in; last user to sign in">${esc(m.last_user)} (last)</span>` : '—')}</td>
        <td class="hide-sm">${esc(m.agent_version ?? '—')}</td>
        <td class="num hide-sm">${m.outbox_depth ?? '—'}</td>
      </tr>`).join('');
    document.getElementById('fleet-sub').textContent =
      `${rows.length} machine${rows.length === 1 ? '' : 's'} · ${rows.filter(m => m.status === 'online').length} online · refreshed ${new Date().toLocaleTimeString()}`;

    tbody.querySelectorAll('tr').forEach(tr => tr.onclick = () => select(+tr.dataset.id, rows));
    if (selectedId === null && rows.length) select(rows[0].machine_id, rows);
  }

  function select(id, rows) {
    selectedId = id;
    const m = rows.find(r => r.machine_id === id);
    document.getElementById('chart-title').textContent = `Usage · ${m ? m.name : id}`;
    document.querySelectorAll('#fleet tbody tr').forEach(tr => tr.classList.toggle('selected', +tr.dataset.id === id));
    loadChart();
  }

  async function loadChart() {
    if (selectedId === null) return;
    const to = new Date(), from = new Date(to - rangeHours * 3600_000);
    const res = await fetch(`/api/machines/${selectedId}/metrics?from=${from.toISOString()}&to=${to.toISOString()}`);
    const data = await res.json();
    // x is real time (epoch ms on a linear axis) so gaps and outages keep their
    // true width instead of collapsing as they would on a category axis.
    const fmt = rangeHours > 24 ? { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' } : { hour: '2-digit', minute: '2-digit' };
    const at = (p) => new Date(p.time).getTime();
    const cpu = data.points.map(p => ({ x: at(p), y: +p.cpu_avg.toFixed(1) }));
    const mem = data.points.map(p => ({ x: at(p), y: pct(p.mem_used_mb, p.mem_total_mb) }));
    document.getElementById('chart-sub').textContent =
      `${data.points.length} points · resolution ${data.resolution}${data.resolution === 'raw' ? '' : ' (average per bucket)'}`;

    const ds = (label, values, color) => ({
      label, data: values, borderColor: color, backgroundColor: color,
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2, spanGaps: false,
    });
    const datasets = [ds('CPU %', cpu, css('--series-1')), ds('Memory used %', mem, css('--series-2'))];
    const xAxis = { min: from.getTime(), max: to.getTime() };

    if (chart) {
      chart.data.datasets = datasets;
      Object.assign(chart.options.scales.x, xAxis);
      chart.update('none');
      return;
    }
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { color: css('--ink-2'), boxWidth: 12, boxHeight: 12, usePointStyle: true, pointStyle: 'line' } },
          tooltip: { callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleString(),
            label: c => ` ${c.dataset.label}: ${c.parsed.y}%`,
          } },
        },
        scales: {
          x: { type: 'linear', ...xAxis, grid: { display: false }, border: { color: css('--axis') },
               ticks: { color: css('--muted'), maxTicksLimit: 8, maxRotation: 0,
                        callback: v => new Date(v).toLocaleString([], fmt) } },
          y: { min: 0, max: 100, grid: { color: css('--grid') }, border: { display: false },
               ticks: { color: css('--muted'), callback: v => v + '%' } },
        },
      },
    });
  }

  document.querySelectorAll('#ranges button').forEach(b => {
    b.setAttribute('aria-pressed', +b.dataset.hours === rangeHours);
    b.onclick = () => {
      rangeHours = +b.dataset.hours;
      document.querySelectorAll('#ranges button').forEach(x => x.setAttribute('aria-pressed', x === b));
      loadChart();
    };
  });

  const size = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(0) + ' MB' : (b / 1e3).toFixed(0) + ' kB';

  async function loadProjects() {
    const rows = await (await fetch('/api/projects')).json();
    const card = document.getElementById('projects-card');
    card.hidden = rows.length === 0;           // the section only appears once some agent has a project root
    if (!rows.length) return;
    document.querySelector('#projects tbody').innerHTML = rows.map(p => `
      <tr>
        <td><strong>${esc(p.name)}</strong>${p.sizes_differ ? ' <span class="muted" title="copies differ in size">⚠ copies differ</span>' : ''}</td>
        <td class="num">${size(p.total_bytes)}</td>
        <td>${p.copies.map(c => `${esc(c.machine)} · ${size(c.bytes)} <span class="muted">(${c.files.toLocaleString()} files, as of ${ago(c.as_of)})</span>`).join('<br>')}</td>
      </tr>`).join('');
    document.getElementById('projects-sub').textContent =
      `${rows.length} project${rows.length === 1 ? '' : 's'} · totals are sums of copies, no deduplication`;
  }

  async function refresh() { try { await loadFleet(); await loadChart(); await loadProjects(); } catch (e) { console.error(e); } }
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
