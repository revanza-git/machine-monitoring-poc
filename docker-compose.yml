# PostgreSQL + TimescaleDB and the server for the PoC. The agent is the one
# component that never runs here: it must run on the Windows host to read real
# counters. The server can also run on the host with `dotnet run` when you
# want to step through it; stop the container first so port 7181 is free.
services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: mm-db
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - mm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: src/Server/Dockerfile
    container_name: mm-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Monitoring: Host=db;Port=5432;Username=mm;Password=mm;Database=monitoring
      # Same URL the agent uses on the host. HTTPS with the development
      # certificate exported by deploy/export-dev-cert.ps1.
      ASPNETCORE_URLS: https://+:7181
      ASPNETCORE_Kestrel__Certificates__Default__Path: /certs/server.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: dev
      # Git-ignored overrides and the machine registry are mounted, not baked in.
      ConfigDir: /config
      # Bind mounts on Docker Desktop do not deliver change notifications;
      # polling keeps AgentConfig hot-reload working from the container.
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    ports:
      - "7181:7181"
    volumes:
      - ./deploy/certs:/certs:ro
      - ./deploy/config:/config:ro

volumes:
  mm-db-data:
